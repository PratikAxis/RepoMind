version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repo_backend
    ports:
      - "8001:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repo_frontend
    ports:
      - "8502:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped
